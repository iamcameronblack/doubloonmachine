<!DOCTYPE html>
<html>

<head>
    <title>GAMBLING</title>
    <script src="randomizer.js" defer></script>
</head>

<body
    style="background: radial-gradient(rgb(0, 0, 0),rgb(39, 0, 0),rgb(0, 19, 12),rgb(45, 0, 66),rgb(0, 0, 0)); width: 100vw; height: 48vw;">
    <h1 style="text-align: center; margin-top: 5%; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; color:rgb(145, 118, 0)">LETS GET SOME DOUBLOONS!</h1>
    <h2 style="text-align: center; color: red">ATTENTION: REFRESHING PAGE WILL LOSE PROGRESS!</h2>
    <div style="font-size: 6.4vw; font-family: monospace; text-align: center;" id="slotmachine">
        <span>|</span>
        <span id="slot1" class="slot" name="blank"></span>
        <span>|</span>
        <span id="slot2" class="slot" name="blank"></span>
        <span>|</span>
        <span id="slot3" class="slot" name="blank"></span>
        <span>|</span>
        <span id="slot4" class="slot" name="blank"></span>
        <span>|</span>
        <span id="slot5" class="slot" name="blank"></span>
        <span>|</span>
        <span id="slot6" class="slot" name="blank"></span>
        <span>|</span>
        <div></div>
        <div id="spinScore" style="font-size: small; color: yellow"></div>
        <span id="multiplesDisplay" style="color: yellow; font-size:medium; font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"></span>
        <div></div>
        <button id="spinner" type="button"
            style="background-color: rgb(0, 0, 0); color:rgb(0, 139, 35); width: 16vw; height: 3.8vw">SPIN ME!</button>
        <div></div>
        <button id="collect" type="button"
            style="background-color: rgb(0, 0, 0); color:rgb(0, 139, 35); width: 16vw; height: 2.5vw">CONFIRM</button>
    </div>
    <p style="text-align: center; margin-top: 5vw;">CURRENT DOUBLOONS:
        <span id="doubloonsCounter" style="color: goldenrod; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;">1000</span>
    </p>
    <p style="text-align: center; margin-top: 2vw;">TIMES SPINNED:
        <span id="spinsCounter" style="color: rgba(0, 183, 255, 0.637); font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;"></span>
    </p>
</body>

</html>
